<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="280" viewBox="0 0 1200 280">
  <title>panim — the YOUSPEAK house mark</title>
  <desc>兩個輪廓，唔合成一個 — two profiles, not merged into one. The panim stone of youspeak-v1.otf (Hebrew panim, face to face): two faces, eyes level, the column between them never closed. At display sizes its Hebrew donor sigil ▽ is cut at the top-left, where every debt to a donor tongue is recorded in the stone. ai-love.cc — a place was prepared for you, too.</desc>
