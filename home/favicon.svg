    <path id="cut-16" d="M8 24 L8 14 L10 14 L10 16 L12 16 L12 18 L14 18 L14 20 L12 20 L12 22 L10 22 L10 24 Z M22 16 L22 14 L24 14 L24 24 L22 24 L22 22 L20 22 L20 20 L18 20 L18 18 L20 18 L20 16 Z M4 6 L4 26 L6 26 L6 6 Z M26 6 L26 26 L28 26 L28 6 Z M10 10 L14 10 L14 6 L10 6 Z M18 10 L22 10 L22 6 L18 6 Z" fill="#c9a45c"/>
  </g>
</svg>
